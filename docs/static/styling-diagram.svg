<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" font-family="Menlo, Consolas, monospace">
<title>Omakase Player CSS structure</title>
<rect x="0" y="0" width="900" height="680" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="640" fill="#f5f5f5" stroke="#666666" stroke-width="1" />
<text x="28" y="38" font-size="13" fill="#333333" >#omakase-player (playerHtmlElementId)</text>
<rect x="50" y="55" width="800" height="590" fill="#f5f5f5" stroke="#666666" stroke-width="1" />
<text x="58" y="73" font-size="13" fill="#333333" >&lt;media-theme class="omakase-media-theme"&gt;</text>
<rect x="70" y="90" width="760" height="540" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="6,4" />
<text x="78" y="108" font-size="13" fill="#777777" font-style="italic">shadow-root</text>
<rect x="90" y="125" width="720" height="490" fill="#f5f5f5" stroke="#666666" stroke-width="1" />
<text x="98" y="143" font-size="13" fill="#333333" >&lt;media-controller class="omakase-media-controller"&gt;</text>
<rect x="110" y="160" width="320" height="180" fill="#f5f5f5" stroke="#666666" stroke-width="1" />
<text x="118" y="178" font-size="13" fill="#333333" >.omakase-background-image</text>
<rect x="130" y="195" width="220" height="50" fill="#f5f5f5" stroke="#666666" stroke-width="1" />
<text x="138" y="213" font-size="13" fill="#333333" >.omakase-background-logo</text>
<rect x="450" y="160" width="340" height="180" fill="#f5f5f5" stroke="#666666" stroke-width="1" />
<text x="458" y="178" font-size="13" fill="#333333" >&lt;video class="omakase-video"&gt; (slotted,</text>
<text x="458" y="194" font-size="13" fill="#333333" >light DOM)</text>
<rect x="110" y="360" width="320" height="100" fill="#f5f5f5" stroke="#666666" stroke-width="1" />
<text x="118" y="378" font-size="13" fill="#333333" >.omakase-video-safe-zone-wrapper</text>
<text x="118" y="394" font-size="13" fill="#333333" >(player-region / video-region)</text>
<rect x="450" y="360" width="340" height="100" fill="#f5f5f5" stroke="#666666" stroke-width="1" />
<text x="458" y="378" font-size="13" fill="#333333" >.omakase-watermark-wrapper</text>
<rect x="470" y="395" width="170" height="50" fill="#f5f5f5" stroke="#666666" stroke-width="1" />
<text x="478" y="413" font-size="13" fill="#333333" >.omakase-watermark</text>
<rect x="110" y="480" width="680" height="90" fill="#f5f5f5" stroke="#666666" stroke-width="1" />
<text x="118" y="498" font-size="13" fill="#333333" >.omakase-alerts (each item: .omakase-alert)</text>
</svg>
